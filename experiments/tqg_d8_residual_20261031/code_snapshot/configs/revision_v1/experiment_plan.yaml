success_criteria:
  - H2 primary classification hypothesis passes on both tasks with all prescribed comparisons.
  - T6 mean BA is no lower than frozen and B_full on each task.
  - T6 target gradient cosine exceeds permuted weights by 0.05 on each task.
  - True source labels exceed permuted source labels in target cosine by 0.05 on each task.
  - Mechanism means are positive and paired directions agree on at least 4 of 5 seeds per task.
  - Independent value over T12 T13 T16 requires at least 0.5 BA percentage point per task per control.
  - Target-direction and finite-nonlinearity subclaims require at least 0.5 BA point over T14 and T15 respectively.
  - Full-paper claims additionally require independent data recent baseline reproduction and equal-time evidence.
failure_criteria:
  - Failure of an individual criterion rejects that claim; never silently change the headline candidate.
  - Matching with no signal over permuted weights in D2 defers B as a whole, not selected seeds or tasks.
  - Rejection above 80 percent is a degenerate feedback flag, not evidence of transferable supervision.
  - Source audit MSE below zero-predictor gain alone does not prove target gains impossible.
  - Any target-final label evaluation invalidates the current development protocol.
  - Any unlogged code or config change, nonfinite value, role overlap or parameter mutation requires repair before continuing.
  - Preserve incomplete and failed jobs; never replace them with favorable seeds.
