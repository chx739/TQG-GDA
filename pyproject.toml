[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsba-gda"
version = "0.1.0"
description = "Target-score boundary adaptation for graph classification"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torch-geometric>=2.4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tsba = "workflows.tsba.run_task:main"

[tool.setuptools.packages.find]
include = ["tsba*", "workflows*"]

[tool.pytest.ini_options]
testpaths = ["tests/tsba"]
pythonpath = ["."]
