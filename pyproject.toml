[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tqg-gda"
version = "0.1.0"
description = "Target-Queried Gradient Learning experiments for graph-level domain adaptation"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "torch-geometric>=2.6,<3", "numpy>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["tqg_gda*"]
