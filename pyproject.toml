[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cela-gda"
version = "0.1.0"
description = "Connected Edge-Law Adaptation for graph classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "scipy>=1.10", "mpmath>=1.2"]

[project.scripts]
cela-task = "scripts.run_task:main"

[tool.setuptools.packages.find]
include = ["cela*", "scripts*"]
